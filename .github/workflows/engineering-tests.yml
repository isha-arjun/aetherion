name: Aerospace engineering validation

on:
  push:
    paths:
      - "engineering/**"
      - "package.json"
      - "main.js"
      - "index.html"
      - ".github/workflows/engineering-tests.yml"
  pull_request:
    paths:
      - "engineering/**"
      - "package.json"
      - ".github/workflows/engineering-tests.yml"
  workflow_dispatch:

jobs:
  orbital-mechanics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser application JavaScript syntax
        run: node --check main.js && node --check engineering/src/academy.js && node --check engineering/src/learning-mode.js && node --check engineering/src/course-content.js
      - name: Run engineering verification tests
        run: npm test
